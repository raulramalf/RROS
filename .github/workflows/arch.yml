name: Arch

# Lily sobre Arch Linux con KDE Plasma.
#  - comprobar: en cada cambio, en un contenedor Arch: los paquetes existen, compila (también Lily Ajustes, en
#    Qt) y pasan las pruebas.
#  - iso: construye la ISO de cada edición (Lite, Standard y Pro, en paralelo) con archiso, la arranca en QEMU con
#    el autotest, la instala (BIOS, UEFI y cifrada) y publica también una máquina virtual con Lily ya instalado
#    (VMDK, para VirtualBox, VMware y QEMU). A mano (Run workflow) o con «[iso-arch]» en el mensaje del commit.
on:
  push:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de hardware
        type: choice
        options: [todas, lite, standard, pro]
        default: todas

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Paquetes de compilación
        run: pacman -Syu --noconfirm --needed base-devel git python cmake qt6-base qt6-declarative qt6-svg qt6-wayland extra-cmake-modules layer-shell-qt kwindowsystem kglobalaccel
      - uses: actions/checkout@v4
      - name: Los paquetes de las listas existen en Arch
        run: scripts/check-packages-arch.sh
      - name: Compilar y pruebas
        run: make WERROR=1 && make test WERROR=1 && make app && make shell SHELL_FULL=ON
      # los iconos de la Tienda que se guardan en la ISO: deben salir casi todos (AppStream de Arch y Flathub)
      - name: Iconos de la Tienda
        run: |
          pacman -S --noconfirm --needed archlinux-appstream-data curl python-pillow libjxl
          ls /usr/share/swcatalog /usr/share/swcatalog/xml /usr/share/swcatalog/icons; ls /usr/share/swcatalog/icons/*/
          scripts/store-icons.sh apps/catalog.toml build/iconos-tienda | tee build/iconos.log
          total=$(grep -c '^\[app\.' apps/catalog.toml); n=$(find build/iconos-tienda -name '*.png' -size +0 | wc -l)
          # que sean PNG de verdad (no una página de error) y una hoja con todos para verlos
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          fs = sorted(glob.glob("build/iconos-tienda/*.png")); bad = []
          sheet = Image.new("RGBA", (16 * 72, ((len(fs) + 15) // 16) * 72), (40, 20, 26, 255))
          for i, f in enumerate(fs):
              try:
                  im = Image.open(f).convert("RGBA"); im.thumbnail((64, 64))
                  sheet.alpha_composite(im, ((i % 16) * 72 + 4, (i // 16) * 72 + 4))
              except Exception as e:
                  if not bad: print("primer fallo:", f, repr(e), open(f, "rb").read(16))
                  bad.append(os.path.basename(f))
          sheet.save("build/iconos-tienda-hoja.png")
          print("no son imágenes:", bad); assert not bad
          PY
          echo "iconos: $n de $total"; ls build/iconos-tienda | sed 's/\.png$//' | sort > /tmp/con
          grep '^\[app\.' apps/catalog.toml | sed 's/^\[app\.//; s/\]$//' | sort | comm -23 - /tmp/con | sed 's/^/sin icono: /'
          [ "$n" -ge $((total * 85 / 100)) ] || { echo "faltan demasiados iconos"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iconos-tienda
          path: build/iconos-tienda-hoja.png
          if-no-files-found: ignore

  iso:
    needs: comprobar
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[iso-arch]')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile == '' || inputs.profile == null || inputs.profile == 'todas') && '["lite","standard","pro"]' || format('["{0}"]', inputs.profile)) }}
    env:
      PROFILE: ${{ matrix.profile }}
      # la RAM mínima de cada edición (profiles/*.toml)
      RAM_MB: ${{ matrix.profile == 'pro' && '6144' || matrix.profile == 'standard' && '4096' || '2048' }}
      # disco de las pruebas de instalación: el instalador pide max_disk_gb del perfil (lite 10, standard 14, pro 20)
      DISK_GB: ${{ matrix.profile == 'pro' && '32' || matrix.profile == 'standard' && '24' || '16' }}
    steps:
      - name: Espacio en disco (fuera lo que no se usa del runner)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
      - name: ISO con archiso (contenedor Arch)
        run: |
          docker run --rm --privileged -v "$PWD:/rros" -w /rros -e PROFILE archlinux:latest bash -ec '
            pacman -Syu --noconfirm --needed archiso base-devel git python cmake qt6-base qt6-declarative qt6-svg qt6-wayland extra-cmake-modules layer-shell-qt kwindowsystem kglobalaccel archlinux-appstream-data curl libjxl
            make WERROR=1
            make app
            make shell SHELL_FULL=ON
            scripts/build-iso-arch.sh "$PROFILE"'
          sudo chown -R "$(id -u):$(id -g)" build
      - name: Autotest de arranque en QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso ovmf
          sudo chmod a+rw /dev/kvm || true
          BASE=arch ISO="$PWD/build/lily-$PROFILE.iso" OUT="$PWD/build/test-arch-$PROFILE" \
            scripts/test-iso.sh "$PROFILE" selftest
      # la captura real del escritorio, también en el registro (en base64, entre marcas) para poder verla sin
      # descargar artefactos
      - name: Captura del escritorio
        if: always()
        run: |
          f=build/test-arch-$PROFILE/escritorio.png
          if [ -s "$f" ]; then
            echo "RROS_CAPTURA_INICIO"; base64 -w 0 "$f"; echo; echo "RROS_CAPTURA_FIN"
          else
            echo "no hay captura"
          fi
      # la ISO se publica si el live pasa su autotest, aunque después falle la prueba de instalación
      - uses: actions/upload-artifact@v4
        with:
          name: lily-${{ env.PROFILE }}-iso
          path: build/lily-${{ env.PROFILE }}.iso
          if-no-files-found: error
      - name: Instalación en un disco virtual y arranque desde él
        run: |
          BASE=arch ISO="$PWD/build/lily-$PROFILE.iso" OUT="$PWD/build/test-arch-install-$PROFILE" \
            scripts/test-iso.sh "$PROFILE" install
      - name: Instalación para UEFI y arranque con OVMF
        run: |
          FIRMWARE=uefi BASE=arch ISO="$PWD/build/lily-$PROFILE.iso" OUT="$PWD/build/test-arch-uefi-$PROFILE" \
            scripts/test-iso.sh "$PROFILE" install
      - name: Instalación cifrada (LUKS2) y arranque con la contraseña del disco
        run: |
          CRYPT=1 BASE=arch ISO="$PWD/build/lily-$PROFILE.iso" OUT="$PWD/build/test-arch-cifrado-$PROFILE" \
            scripts/test-iso.sh "$PROFILE" install
      # máquina virtual con Lily instalado (usuario y contraseña «lily»): se importa en VirtualBox o VMware, o se
      # arranca con QEMU. Antes se borran los discos de las pruebas para dejar sitio
      - name: Máquina virtual lista para usar
        run: |
          rm -f build/test-arch-*-"$PROFILE"/disco.qcow2
          BASE=arch ISO="$PWD/build/lily-$PROFILE.iso" OUT="$PWD/build/vm-$PROFILE" \
            scripts/test-iso.sh "$PROFILE" vm
      - uses: actions/upload-artifact@v4
        with:
          name: lily-${{ env.PROFILE }}-virtualbox
          path: build/vm-${{ env.PROFILE }}/lily-${{ env.PROFILE }}.vdi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lily-${{ env.PROFILE }}-vmware-qemu
          path: build/vm-${{ env.PROFILE }}/lily-${{ env.PROFILE }}.vmdk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lily-${{ env.PROFILE }}-selftest-log
          path: |
            build/test-arch-${{ env.PROFILE }}/serial.log
            build/test-arch-${{ env.PROFILE }}/escritorio.png
            build/test-arch-install-${{ env.PROFILE }}/*.log
            build/test-arch-cifrado-${{ env.PROFILE }}/*.log
            build/test-arch-uefi-${{ env.PROFILE }}/*.log
          if-no-files-found: ignore
