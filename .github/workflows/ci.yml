name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (warnings como errores)
        run: make WERROR=1
      - name: Tests (ASan + UBSan)
        run: make test WERROR=1
      - name: Validar perfiles
        run: |
          for p in lite standard pro; do
            RROS_PROFILE_DIR=profiles build/rros-config validate --profile-file profiles/$p.toml
          done
      - name: Documentación de personalización al día
        run: |
          make docs-schema
          git diff --exit-code docs/CUSTOMIZATION.md
      - name: La demo de la GUI se genera
        run: |
          scripts/build-gui-demo.sh
          test -s build/gui-demo.html
      - name: JavaScript de la GUI sin errores de sintaxis
        run: |
          awk '/^<script>$/{f=1;next} /^<\/script>$/{f=0} f' gui/index.html > /tmp/gui.js
          node --check /tmp/gui.js
          node --check gui/mock.js
      - name: Todos los paquetes de las listas existen en Ubuntu 24.04
        run: |
          sudo apt-get update
          scripts/check-packages.sh
      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR scripts/*.sh tests/cli.sh overlay/common/usr/bin/* overlay/common/usr/libexec/*
