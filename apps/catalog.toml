# Catálogo de aplicaciones de RROS. `rros apps install ID` instala con el gestor de paquetes del sistema
# (pacman en Arch, apt en Ubuntu) o con Flatpak (Flathub) si no hay paquete.
# Campos: name, category, desc, pacman (paquetes de Arch, separados por comas), apt (paquete de Ubuntu),
#         flatpak (id en Flathub), shipped (perfiles que ya la traen), cmd (programa que se lanza).
# Los paquetes de pacman los comprueba la CI de Arch (check-packages-arch.sh) y los de apt, contra Ubuntu 24.04;
# los ids de Flatpak no se pueden comprobar sin red.

# ---------------- Internet ----------------
[app.epiphany]
name = "Web (Epiphany)"
category = "internet"
desc = "Navegador ligero de GNOME."
apt = "epiphany-browser"
pacman = "epiphany"
cmd = "epiphany"

