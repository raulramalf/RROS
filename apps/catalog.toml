# Catálogo de aplicaciones de RROS. `rros apps install ID` instala con apt o con Flatpak (Flathub).
# Campos: name, category, desc, apt (paquete de Ubuntu), flatpak (id en Flathub),
#         shipped (perfiles que ya la traen), cmd (programa que se lanza).
# Los paquetes apt están comprobados contra Ubuntu 24.04; los ids de Flatpak no se pueden comprobar sin red.

# ---------------- Internet ----------------
[app.epiphany]
name = "Web (Epiphany)"
category = "internet"
desc = "Navegador ligero de GNOME. Es el navegador por defecto."
apt = "epiphany-browser"
shipped = "lite,standard,pro"
cmd = "epiphany"

[app.firefox]
name = "Firefox"
category = "internet"
desc = "El navegador de Mozilla, con sus extensiones."
flatpak = "org.mozilla.firefox"
