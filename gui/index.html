<title>RROS Ajustes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700&display=swap">
<style>
/* Concepto: la propia ventana de ajustes se pinta con la paleta del tema que estás editando. */
:root {
  --bg: #0b1020; --surface: #141c38; --surface2: #1b2547; --text: #e6ecff; --muted: #8a96bd;
  --border: #26305a; --accent: #7c5cff; --accent-fg: #0b1020;
  --red: #ff6b81; --green: #4ade80; --yellow: #fbbf24;
  --font-display: "Sora", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f7ff; --surface: #ffffff; --surface2: #eef1ff; --text: #141a33; --muted: #5b6489;
    --border: #d5dbf5; --accent: #5b3df5; --accent-fg: #ffffff; --red: #d6334f; --green: #16a34a; --yellow: #b7791f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f7ff; --surface: #ffffff; --surface2: #eef1ff; --text: #141a33; --muted: #5b6489;
  --border: #d5dbf5; --accent: #5b3df5; --accent-fg: #ffffff; --red: #d6334f; --green: #16a34a; --yellow: #b7791f;
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; margin: 0;
}
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; padding-left: env(safe-area-inset-left, 0px); }
aside { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
.brand small { font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav .grp { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 10px 8px 4px; }
nav button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 8px; color: var(--text); display: flex; justify-content: space-between; gap: 8px; }
nav button:hover { background: var(--surface2); }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav .count { font-family: var(--font-mono); font-size: 11px; opacity: 0.65; }
main { min-width: 0; padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-left: 24px; padding-block: 0 48px; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.top .search { flex: 1 1 220px; min-width: 0; }
input[type="text"], input[type="search"], input[type="number"], select, textarea {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0;
}
textarea { width: 100%; font-family: var(--font-mono); font-size: 12px; min-height: 120px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 8px 14px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.pill { font-family: var(--font-mono); font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; color: var(--muted); white-space: nowrap; }
h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 16px; margin: 28px 0 10px; }
.sub { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 300px) 30px; gap: 8px 16px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .lbl { min-width: 0; }
.row .lbl b { font-weight: 500; display: block; }
.row .lbl code, code { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.row .ctl { display: flex; gap: 8px; align-items: center; justify-content: flex-end; min-width: 0; }
.row .ctl input[type="text"], .row .ctl select { width: 100%; }
.row .ctl input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.row .ctl input[type="number"] { width: 72px; }
.reset { all: unset; cursor: pointer; width: 26px; height: 26px; text-align: center; line-height: 26px; border-radius: 6px; color: var(--muted); }
.reset:hover { background: var(--surface2); color: var(--text); }
.reset:focus-visible { outline: 2px solid var(--accent); }
.reset[hidden] { display: block !important; visibility: hidden; }
.user-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); background: var(--accent-fg); }
.switch input:focus-visible + span { outline: 2px solid var(--text); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 6px 12px; font-size: 13px; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.tcard { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.tcard:hover { border-color: var(--muted); }
.tcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tprev { height: 84px; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; border: 1px solid rgba(128,128,128,.25); }
.tprev .bar { height: 10px; border-radius: 3px; }
.tprev .body { flex: 1; display: flex; gap: 6px; }
.tprev .win { flex: 1; border-radius: 4px; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
.tprev .ln { height: 4px; border-radius: 2px; }
.tcard .tn { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 500; }
.tcard .sw { display: flex; gap: 3px; }
.tcard .sw i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.badge { font-family: var(--font-mono); font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatches button.dot { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 0 1px var(--border); border: 2px solid var(--surface); }
.swatches button.dot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }
.swatches button.dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.swatches input[type="color"] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.acard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.acard .an { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.acard .an b { font-weight: 600; overflow-wrap: anywhere; }
.acard p { margin: 0; color: var(--muted); flex: 1; }
.acard .ab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge.ok { color: var(--green); border-color: var(--green); }
.cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.cats button { all: unset; cursor: pointer; padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 13px; }
.cats button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.cats button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pad { padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.wrapline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.desk { border-radius: 12px; border: 1px solid var(--border); overflow: hidden; height: 230px; display: flex; flex-direction: column; background: var(--p-bg); color: var(--p-text); font-size: 12px; }
.desk.pos-bottom { flex-direction: column-reverse; }
.desk .panel { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; background: var(--p-bg); border-bottom: 2px solid var(--p-accent); gap: 8px; }
.desk.pos-bottom .panel { border-bottom: 0; border-top: 2px solid var(--p-accent); }
.desk .panel .ws { display: flex; gap: 4px; }
.desk .panel .ws i { font-style: normal; padding: 0 8px; border-radius: 4px; color: var(--p-muted); }
.desk .panel .ws i.on { background: var(--p-accent); color: var(--p-bg); }
.desk .panel .pf { background: var(--p-accent); color: var(--p-bg); border-radius: 4px; padding: 0 8px; font-weight: 600; }
.desk .area { flex: 1; display: flex; gap: var(--gap, 8px); padding: calc(var(--gap, 8px) / 2); min-height: 0; }
.desk .w { flex: 1; min-width: 0; background: var(--p-surface); border: var(--bw, 2px) solid var(--p-border); border-radius: var(--rad, 0); overflow: hidden; display: flex; flex-direction: column; }
.desk .w.f { border-color: var(--p-accent); }
.desk .w .t { background: var(--p-bg); color: var(--p-muted); padding: 2px 8px; font-size: 11px; }
.desk .w .c { padding: 8px; font-family: var(--font-mono); font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
.desk .c .a { color: var(--p-accent); } .desk .c .g { color: var(--p-green); } .desk .c .m { color: var(--p-muted); }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.colors label { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.colors input[type="color"] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }
.dyn { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); }
.dyn:last-child { border-bottom: 0; }
.dyn input[type="text"] { width: 100%; font-family: var(--font-mono); font-size: 12px; }
.dyn .id { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { all: unset; cursor: pointer; font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border: 1px dashed var(--border); border-radius: 999px; color: var(--muted); }
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip:focus-visible { outline: 2px solid var(--accent); }
.empty { padding: 22px; text-align: center; color: var(--muted); }
.badge.warn { color: var(--yellow); border-color: var(--yellow); }
.badge.fail { color: var(--red); border-color: var(--red); }
.badge.sys { color: var(--accent); border-color: var(--accent); }
.score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
.score .num { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score .bar { flex: 1; min-width: 160px; height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.score .bar i { display: block; height: 100%; background: var(--accent); }
.checks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.check .ic { font-weight: 700; text-align: center; }
.check.ok .ic { color: var(--green); } .check.warn .ic { color: var(--yellow); } .check.fail .ic { color: var(--red); } .check.info .ic { color: var(--muted); }
.check b { display: block; } .check p { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.check code { display: inline-block; margin-top: 6px; overflow-wrap: anywhere; white-space: normal; }
.devgroup { margin: 18px 0 8px; font-weight: 600; }
.dev { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 6px; }
.dev.part { margin-left: 22px; }
.dev .dn { flex: 1; min-width: 180px; } .dev .dn b { overflow-wrap: anywhere; } .dev .dn small { display: block; color: var(--muted); overflow-wrap: anywhere; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: end; }
.formgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.formgrid label input, .formgrid label select { color: var(--text); }
.muted { color: var(--muted); }
ol.steps { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; padding: 0; margin: 0 0 16px; }
ol.steps li { font-size: 12.5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
ol.steps li.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
ol.steps li.done { color: var(--text); }
.card .an { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; margin-top: 6px; cursor: pointer; }
label.opt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
label.opt.off { opacity: 0.6; cursor: not-allowed; }
label.opt input { margin-top: 3px; accent-color: var(--accent); }
label.opt small { display: block; color: var(--muted); }
pre.log { font-family: var(--font-mono); font-size: 11.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
#toast { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 16px; max-width: min(560px, 92vw); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
#toast.show { opacity: 1; }
#toast.err { border-color: var(--red); color: var(--red); }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  nav .grp { display: none; }
  nav button { white-space: nowrap; flex: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .row { grid-template-columns: minmax(0, 1fr) 30px; }
  .row .ctl { grid-column: 1; justify-content: flex-start; }
  .row .reset { grid-column: 2; grid-row: 1; }
  .dyn { grid-template-columns: minmax(0, 1fr) auto; }
  .dyn .id { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside>
    <div class="brand">RROS Ajustes<small id="ver"></small></div>
    <nav id="nav" aria-label="Secciones"></nav>
  </aside>
  <main>
    <div class="top">
      <input class="search" id="search" type="search" placeholder="Buscar ajuste o clave (tecla /)" aria-label="Buscar ajustes">
      <span class="pill" id="profile"></span>
      <button class="btn ghost" id="apply" type="button">Aplicar al escritorio</button>
    </div>
    <div id="page"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var TOKEN = new URLSearchParams(location.search).get("t") || "";
  var S = null;           // estado del servidor
  var page = "themes";    // sección actual
  var query = "";
  var editTheme = "";     // tema propio en edición

  /* ---------- utilidades ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag), i, c;
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (i = 2; i < arguments.length; i++) {
      c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  var toastTimer;
  function toast(msg, err) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.className = "show" + (err ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ""; }, err ? 5000 : 1800);
  }
  function api(path, body) {
    if (window.RROS_MOCK) return Promise.resolve(window.RROS_MOCK(path, body));
    var opt = { headers: { "X-RROS-Token": TOKEN } };
    if (body) {
      opt.method = "POST";
      opt.headers["Content-Type"] = "application/x-www-form-urlencoded";
      opt.body = new URLSearchParams(body).toString();
    }
    return fetch(path, opt).then(function (r) {
      if ((r.headers.get("content-type") || "").indexOf("json") < 0) return r.text();
      return r.json().catch(function () { return { ok: false, error: "respuesta no válida" }; });
    });
  }
  /* página inicial desde la dirección: #seguridad, #dispositivos, #archivos, #tienda, #cat:ui... */
  var ALIAS = { seguridad: "security", dispositivos: "devices", archivos: "files", tienda: "apps", temas: "themes", copias: "backup", accesibilidad: "access", bienvenida: "welcome", instalar: "install" };
  (function () {
    var h0 = decodeURIComponent((location.hash || "").slice(1));
    if (/^[a-z:]{1,31}$/.test(h0)) page = ALIAS[h0] || h0;
  })();
  function load() {
    return api("/api/state").then(function (s) {
      if (s && s.ok === false) { toast(s.error || "no se pudo cargar", true); return; }
      S = s; paintTheme(); drawNav(); drawPage();
    });
  }
  function keyObj(k) { return S.keys.filter(function (x) { return x.key === k; })[0]; }
  function setKey(key, value) {

      return true;
    });
  }
  function unsetKey(key) {
    return api("/api/unset", { key: key }).then(function (r) {

      return load();
    });
  }

  /* ---------- tema de la propia ventana ---------- */
  function paintTheme() {
    var p = S.current.palette, r = document.documentElement.style;
