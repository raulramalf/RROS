# Pantalla de inicio de sesión de Lily: SDDM sobre Wayland (sin X11) con el tema propio de Lily
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,LANG=es_ES.UTF-8

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=rros
CursorTheme=breeze_cursors

[Users]
MaximumUid=60000
