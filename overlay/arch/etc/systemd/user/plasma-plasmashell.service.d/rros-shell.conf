# Lily Shell ocupa el sitio de plasmashell en la sesión: la barra, el dock, el Launchpad, el centro de control,
# los avisos y el fondo son de Lily; KWin sigue gestionando las ventanas. Se conserva la unidad de Plasma (y su
# lugar en el arranque de la sesión); solo cambia el programa.
[Unit]
Description=Lily Shell

[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/rros-shell
Restart=on-failure
RestartSec=1
