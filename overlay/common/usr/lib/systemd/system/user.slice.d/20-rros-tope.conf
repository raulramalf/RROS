# Lily nunca pasa de 4 GB de RAM, abras lo que abras: las aplicaciones y el escritorio (user.slice) hasta 3 GB y los
# servicios del sistema (system.slice) hasta 1 GB. Al acercarse (MemoryHigh) el núcleo recupera memoria y la
# comprime en la zram; si aun así se llega al tope, systemd-oomd cierra la aplicación que más gasta.
# En equipos con menos RAM manda la RAM del equipo.
[Slice]
MemoryHigh=2816M
MemoryMax=3G
