# RROS live
export USERNAME="rros"
export USERFULLNAME="RROS Live"
export HOST="rros"
# BUILD_SYSTEM debe ser "Ubuntu" o "Debian": casper solo define MP_QUIET="-q" para esos valores, y con
# otro nombre `modprobe "" -b overlay` falla y el sistema live no arranca. El nombre del producto va en FLAVOUR.
export BUILD_SYSTEM="Ubuntu"
export FLAVOUR="RROS"
