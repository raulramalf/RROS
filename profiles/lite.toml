# Perfil Lite: equipos de 1-2 GB de RAM, CPU antiguas, sin GPU dedicada.
[profile]
name = "lite"
min_ram_mb = 1024
max_idle_ram_mb = 512
max_disk_gb = 6

[build]
libc = "musl"
kernel = "lite"
multilib = false

[ui]
theme = "aurora"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
gap = 4
border_width = 2
panel_position = "bottom"
panel_size = 40
compositor = "hyprland"
wallpaper_style = "degradado"
animation_style = "rapida"
border_gradient = false
dock = false
effects = "off"
animations = false
blur = false
shadows = false
transparency = 0
scale = 100
font_size = 10
layout = "floating"
workspaces = 4
tiling_layout = "dwindle"
blur_strength = 4
dim_inactive = false

[panel]
# estilo «clásico»: barra de tareas abajo, como en Windows (rros theme escritorio)
style = "flat"
left = "apps,taskbar"
center = "none"
right = "updates,tray,network,audio,battery,clock,power"
taskbar = true

[input]
gestures = true

[system]
auto_updates = true
swap = "zram"
zram_percent = 50
zram_algo = "lz4"
swappiness = 100

[services]
bluetooth = false
printing = false
indexer = false
location = false
flatpak = false

[apps]
terminal = "foot"
browser = "epiphany"
files = "thunar"
editor = "mousepad"

[boot]
splash = false
quiet = true
timeout_seconds = 2

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false

[locale]
# idioma del sistema (menús de las aplicaciones); la zona horaria la elige el instalador
language = "es_ES.UTF-8"
