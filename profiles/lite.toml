# Perfil Lite: equipos con 2-4 GB de RAM y 2 núcleos (64 bits), sin GPU dedicada. Plasma sin efectos
# (todo aparece al instante), dock plano y lo justo instalado.
[profile]
name = "lite"
min_ram_mb = 2048
max_idle_ram_mb = 1280
max_disk_gb = 10

[build]
libc = "glibc"
kernel = "lite"
multilib = false

[ui]
theme = "lirio"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
font_size = 10
scale = 100
wallpaper_style = "aurora"
wallpaper_video = ""
wallpaper_live = "off"
wallpaper_pause_battery = true
effects = "off"
animations = false
animation_style = "rapida"
blur = false
blur_strength = 4
shadows = true
transparency = 0
dim_inactive = false
corner_radius = 10
workspaces = 1
hot_corners = true
# estilo «rros» (Fusión): barra de tareas abajo de borde a borde, siempre visible, con inicio, buscador,
# las aplicaciones en el centro, la bandeja y el reloj
cursor_theme = "RROS-Lirio"
taskbar_style = "rros"
taskbar_align = "auto"
taskbar_size = 48
taskbar_labels = false
taskbar_search = true
panel_position = "top"
panel_size = 28
dock = true
dock_style = "2d"
dock_icon_size = 44
dock_position = "bottom"
dock_hiding = "never"
dock_launchpad = true
dock_apps = "org.kde.dolphin,firefox,rros-apps,org.kde.konsole,org.kde.kate,rros-settings"
window_buttons = "right"
global_menu = false

[panel]
style = "flat"
taskbar = false

[audio]
sound_theme = "ocean"
volume_step = 5
volume_feedback = true
max_volume = 100

[input]
gestures = true

[system]
auto_updates = true
swap = "zram"
zram_percent = 50
zram_algo = "lz4"
swappiness = 100

[services]
bluetooth = false
printing = false
indexer = false
location = false
flatpak = false

[apps]
terminal = "konsole"
browser = "firefox"
files = "dolphin"
editor = "kate"

[boot]
splash = false
quiet = true
timeout_seconds = 2

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false
# antivirus (ClamAV): el tiempo real usa ~1 GB de RAM, por eso solo va encendido en Pro
av_realtime = false
av_schedule = "semanal"
av_action = "cuarentena"
av_updates = true
av_max_file_mb = 100
# directivas
password_min_length = 0
password_complex = false
usb_guard = false
tmp_noexec = false

[locale]
# idioma del sistema (menús de las aplicaciones); la zona horaria la elige el instalador
language = "es_ES.UTF-8"
