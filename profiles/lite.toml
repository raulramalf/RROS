# Perfil Lite: equipos con 2-4 GB de RAM y 2 núcleos (64 bits), sin GPU dedicada. Plasma sin efectos
# (todo aparece al instante), dock plano y lo justo instalado.
[profile]
name = "lite"
min_ram_mb = 2048
max_idle_ram_mb = 1280
max_disk_gb = 10

[build]
libc = "glibc"
kernel = "lite"
multilib = false

[ui]
theme = "aurora"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
font_size = 10
scale = 100
wallpaper_style = "aurora"
effects = "off"
animations = false
animation_style = "rapida"
blur = false
blur_strength = 4
shadows = true
transparency = 0
dim_inactive = false
corner_radius = 10
workspaces = 1
hot_corners = true
# estilo «moderno» (rros theme escritorio): barra fina arriba y dock abajo, como en macOS
panel_position = "top"
panel_size = 28
dock = true
dock_style = "2d"
dock_icon_size = 44
dock_position = "bottom"
dock_hiding = "dodge"
dock_launchpad = true
window_buttons = "left"
global_menu = true

[panel]
style = "flat"
taskbar = false

[audio]
sound_theme = "ocean"
volume_step = 5
volume_feedback = true
max_volume = 100

[input]
gestures = true

[system]
auto_updates = true
swap = "zram"
zram_percent = 50
zram_algo = "lz4"
swappiness = 100

[services]
bluetooth = false
printing = false
indexer = false
location = false
flatpak = false

[apps]
terminal = "konsole"
browser = "firefox"
files = "dolphin"
editor = "kate"

[boot]
splash = false
quiet = true
timeout_seconds = 2

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false

[locale]
# idioma del sistema (menús de las aplicaciones); la zona horaria la elige el instalador
language = "es_ES.UTF-8"
