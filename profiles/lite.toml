# Perfil Lite: equipos de 2-4 GB de RAM, CPU antiguas, sin GPU dedicada (Plasma con pocos efectos).
[profile]
name = "lite"
min_ram_mb = 2048
max_idle_ram_mb = 1280
max_disk_gb = 8

[build]
libc = "musl"
kernel = "lite"
multilib = false

[ui]
theme = "aurora"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
gap = 4
border_width = 2
panel_position = "top"
panel_size = 30
compositor = "hyprland"
wallpaper_style = "degradado"
animation_style = "rapida"
border_gradient = false
dock = true
effects = "off"
animations = false
blur = false
shadows = false
transparency = 0
scale = 100
font_size = 10
layout = "floating"
workspaces = 4
tiling_layout = "dwindle"
blur_strength = 4
dim_inactive = false

[panel]
# estilo «moderno»: barra fina arriba y dock abajo, como en macOS (rros theme escritorio)
style = "floating"
left = "apps,workspaces"
center = "clock"
right = "updates,tray,network,audio,battery,power"
taskbar = false

[input]
gestures = true

[system]
auto_updates = true
swap = "zram"
zram_percent = 50
zram_algo = "lz4"
swappiness = 100

[services]
bluetooth = false
printing = false
indexer = false
location = false
flatpak = false

[apps]
terminal = "konsole"
browser = "firefox"
files = "dolphin"
editor = "kate"

[boot]
splash = false
quiet = true
timeout_seconds = 2

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false

[locale]
# idioma del sistema (menús de las aplicaciones); la zona horaria la elige el instalador
language = "es_ES.UTF-8"
