# Perfil Pro: equipos con 8 GB de RAM, 4 núcleos y GPU (integrada moderna o dedicada). Todos los efectos:
# desenfoque, lámpara mágica, transparencias y el dock en 3D.
[profile]
name = "pro"
min_ram_mb = 6144
max_idle_ram_mb = 3072
max_disk_gb = 20

[build]
libc = "glibc"
kernel = "pro"
multilib = true

[ui]
theme = "lirio"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
font_size = 10
scale = 100
wallpaper_style = "ondas"
# fondo de imagen de Lily (si falta el archivo, se usa el generado con wallpaper_style)
wallpaper = "/usr/share/wallpapers/Lily/lirio.jpg"
wallpaper_video = ""
wallpaper_live = "petalos"
wallpaper_pause_battery = true
effects = "advanced"
animations = true
animation_speed = 100
animation_style = "suave"
blur = true
blur_strength = 8
shadows = true
transparency = 10
dim_inactive = false
corner_radius = 12
workspaces = 4
hot_corners = true
# estilo «rros» (Fusión): barra de tareas abajo de borde a borde, siempre visible, con inicio, buscador,
# las aplicaciones en el centro, la bandeja y el reloj (el dock 3D, en el estilo Dock)
cursor_theme = "Lily-Lirio"
taskbar_style = "rros"
taskbar_align = "auto"
taskbar_size = 52
taskbar_labels = false
taskbar_search = true
panel_position = "top"
panel_size = 28
dock = true
dock_style = "3d"
dock_icon_size = 52
dock_position = "bottom"
dock_hiding = "never"
dock_launchpad = true
dock_apps = "org.kde.dolphin,firefox,rros-apps,org.kde.konsole,org.kde.kate,rros-settings"
window_buttons = "right"
global_menu = false

[panel]
style = "flat"
taskbar = false

[audio]
sound_theme = "ocean"
volume_step = 5
volume_feedback = true
max_volume = 100

[input]
gestures = true

[system]
auto_updates = true
swap = "zram"
zram_percent = 25
zram_algo = "zstd"
swappiness = 60

[services]
bluetooth = true
printing = true
indexer = true
location = false
flatpak = true

[apps]
terminal = "konsole"
browser = "firefox"
files = "dolphin"
editor = "kate"

[boot]
splash = true
quiet = true
timeout_seconds = 3

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false
# antivirus (ClamAV): el tiempo real usa ~1 GB de RAM, por eso solo va encendido en Pro
av_realtime = true
av_schedule = "diario"
av_action = "cuarentena"
av_updates = true
av_max_file_mb = 100
# directivas
password_min_length = 8
password_complex = false
usb_guard = false
tmp_noexec = false

[locale]
# idioma del sistema (menús de las aplicaciones); la zona horaria la elige el instalador
language = "es_ES.UTF-8"
