# Perfil Pro: equipos de 8 GB de RAM, gama alta con GPU.
[profile]
name = "pro"
min_ram_mb = 6144
max_idle_ram_mb = 4096
max_disk_gb = 20

[build]
libc = "glibc"
kernel = "pro"
multilib = true

[ui]
theme = "aurora"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
gap = 10
border_width = 3
panel_position = "top"
panel_size = 36
compositor = "full"
effects = "advanced"
animations = true
animation_speed = 100
blur = true
shadows = true
transparency = 20
scale = 100
font_size = 11
corner_radius = 12
layout = "hybrid"
workspaces = 6

[system]
auto_updates = true
swap = "zram"
zram_percent = 25
zram_algo = "zstd"
swappiness = 60

[services]
bluetooth = true
printing = true
indexer = true
location = false
flatpak = true

[apps]
terminal = "foot"
browser = "epiphany"
files = "thunar"
editor = "mousepad"

[boot]
splash = true
quiet = true
timeout_seconds = 3

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false
