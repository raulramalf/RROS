# Perfil Standard: equipos de 4 GB de RAM, gama media.
[profile]
name = "standard"
min_ram_mb = 3072
max_idle_ram_mb = 2048
max_disk_gb = 12

[build]
libc = "glibc"
kernel = "standard"
multilib = false

[ui]
theme = "aurora"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
gap = 8
border_width = 2
panel_position = "bottom"
panel_size = 40
compositor = "hyprland"
wallpaper_style = "aurora"
animation_style = "suave"
border_gradient = true
blur_strength = 6
dock = false
effects = "basic"
animations = true
animation_speed = 100
blur = true
shadows = true
transparency = 10
scale = 100
font_size = 11
corner_radius = 8
layout = "floating"
workspaces = 4
tiling_layout = "dwindle"
dim_inactive = false

[panel]
# estilo «clásico»: barra de tareas abajo, como en Windows (rros theme escritorio)
style = "flat"
left = "apps,taskbar"
center = "none"
right = "updates,tray,network,audio,battery,clock,power"
taskbar = true

[input]
gestures = true

[system]
auto_updates = true
swap = "zram"
zram_percent = 50
zram_algo = "zstd"
swappiness = 100

[services]
bluetooth = true
printing = false
indexer = false
location = false
flatpak = true

[apps]
terminal = "foot"
browser = "epiphany"
files = "thunar"
editor = "mousepad"

[boot]
splash = true
quiet = true
timeout_seconds = 3

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false

[locale]
# idioma del sistema (menús de las aplicaciones); la zona horaria la elige el instalador
language = "es_ES.UTF-8"
