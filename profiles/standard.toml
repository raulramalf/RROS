# Perfil Standard: equipos con 4-8 GB de RAM y 4 hilos. Animaciones rápidas, sin desenfoque, dock plano.
[profile]
name = "standard"
min_ram_mb = 4096
max_idle_ram_mb = 2048
max_disk_gb = 14

[build]
libc = "glibc"
kernel = "standard"
multilib = false

[ui]
theme = "aurora"
color_scheme = "dark"
font = "Inter"
font_mono = "JetBrains Mono"
font_size = 10
scale = 100
wallpaper_style = "aurora"
effects = "basic"
animations = true
animation_speed = 125
animation_style = "suave"
blur = false
blur_strength = 6
shadows = true
transparency = 0
dim_inactive = false
corner_radius = 10
workspaces = 2
hot_corners = true
# estilo «moderno» (rros theme escritorio): barra fina arriba y dock abajo, como en macOS
panel_position = "top"
panel_size = 28
dock = true
dock_style = "2d"
dock_icon_size = 48
dock_position = "bottom"
dock_hiding = "dodge"
dock_launchpad = true
window_buttons = "left"
global_menu = true

[panel]
style = "flat"
taskbar = false

[audio]
sound_theme = "ocean"
volume_step = 5
volume_feedback = true
max_volume = 100

[input]
gestures = true

[system]
auto_updates = true
swap = "zram"
zram_percent = 50
zram_algo = "zstd"
swappiness = 100

[services]
bluetooth = true
printing = false
indexer = false
location = false
flatpak = true

[apps]
terminal = "konsole"
browser = "firefox"
files = "dolphin"
editor = "kate"

[boot]
splash = true
quiet = true
timeout_seconds = 3

[privacy]
telemetry = false

[security]
# nivel "estandar" (rros-security level estandar); ver docs/SEGURIDAD.md
firewall = true
firewall_ping = true
kernel_hardening = true
usb_storage = true
camera = true
login_attempts = 10
sudo_timeout_minutes = 5
core_dumps = false

[locale]
# idioma del sistema (menús de las aplicaciones); la zona horaria la elige el instalador
language = "es_ES.UTF-8"
