<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RROS Escritorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Escritorio web de RROS, con el aspecto del escritorio Plasma de RROS: barra de menús arriba, dock abajo,
   ventanas con los botones de semáforo a la izquierda. Los colores son las paletas reales de rros-theme. */
:root {
  --bg: #0b1020; --surface: #141c38; --text: #e6ecff; --muted: #8a96bd; --border: #26305a;
  --accent: #7c5cff; --red: #ff6b81; --green: #4ade80; --yellow: #fbbf24; --blue: #60a5fa; --cyan: #22d3ee; --magenta: #c084fc;
  --ui: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --bar: 30px; color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--ui); user-select: none; -webkit-user-select: none }
button { font: inherit; color: inherit }
#desktop { position: fixed; inset: 0; background: var(--bg) center / cover no-repeat; transition: background-image .4s }

/* --- barra de menús --- */
#menubar { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--bar) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 2px; z-index: 9000;
  background: color-mix(in srgb, var(--surface) 72%, transparent); backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid color-mix(in srgb, var(--text) 8%, transparent) }
.mb { height: 24px; padding: 0 9px; border: 0; background: none; border-radius: 6px; cursor: default; white-space: nowrap; display: flex; align-items: center; gap: 6px }
.mb:hover, .mb[aria-expanded="true"] { background: color-mix(in srgb, var(--text) 14%, transparent) }
.mb.app { font-weight: 700 }
.mb .logo { width: 16px; height: 16px }
#menubar .spacer { flex: 1 }
.mb.st { color: var(--text); font-variant-numeric: tabular-nums }
@media (max-width: 640px) { .mb.opt { display: none } }

/* menús desplegables */
.menu { position: absolute; z-index: 9500; min-width: 210px; padding: 5px; border-radius: 10px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); box-shadow: 0 14px 40px rgba(0,0,0,.45) }
.menu button { display: flex; justify-content: space-between; gap: 24px; width: 100%; padding: 5px 10px; border: 0; background: none; border-radius: 5px; text-align: left; cursor: default }
.menu button:hover, .menu button:focus-visible { background: var(--accent); color: #fff; outline: none }
.menu button:disabled { color: var(--muted); background: none }
.menu kbd { font: 12px var(--ui); color: inherit; opacity: .6 }
.menu hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--text) 12%, transparent); margin: 4px 6px }

/* --- iconos del escritorio --- */
#icons { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: calc(var(--bar) + 18px); display: grid; gap: 14px; z-index: 1 }
.dicon { width: 84px; display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: default; text-align: center; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.7) }
.dicon.sel { background: color-mix(in srgb, var(--accent) 30%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent) }
.dicon svg { width: 48px; height: 48px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.4)) }

/* --- ventanas --- */
.win { position: absolute; display: flex; flex-direction: column; min-width: 280px; min-height: 160px; border-radius: 12px; overflow: hidden;
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
  box-shadow: 0 22px 60px rgba(0,0,0,.55), 0 0 0 .5px rgba(0,0,0,.6) }
.win.inactive { box-shadow: 0 12px 30px rgba(0,0,0,.4) }
.win.anim { transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1), width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), transform .3s ease, opacity .3s ease }
.win.opening { transform: scale(.94); opacity: 0 }
.win.closing { transform: scale(.94); opacity: 0 }
.titlebar { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; cursor: default; position: relative; background: var(--surface) }
.lights { display: flex; gap: 8px; z-index: 1 }
.light { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; cursor: default }
.light svg { width: 8px; height: 8px; opacity: 0; stroke: rgba(0,0,0,.6); stroke-width: 1.6; stroke-linecap: round; fill: none }
.lights:hover .light svg, .light:focus-visible svg { opacity: 1 }
.light.close { background: #ff5f57 } .light.min { background: #febc2e } .light.max { background: #28c840 }
.win.inactive .light { background: color-mix(in srgb, var(--text) 22%, transparent) }
.win.inactive .lights:hover .light.close { background: #ff5f57 } .win.inactive .lights:hover .light.min { background: #febc2e } .win.inactive .lights:hover .light.max { background: #28c840 }
.wtitle { position: absolute; left: 90px; right: 90px; text-align: center; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none }
.win.inactive .wtitle { color: var(--muted) }
.wbody { flex: 1; min-height: 0; overflow: auto; background: var(--bg); user-select: text; -webkit-user-select: text; position: relative }
.grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 2 }

/* --- dock --- */
#dock { position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 8000;
  display: flex; align-items: flex-end; gap: 6px; padding: 7px 9px; border-radius: 20px; max-width: calc(100vw - 16px); overflow-x: auto;
  background: color-mix(in srgb, var(--surface) 55%, transparent); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border: 1px solid color-mix(in srgb, var(--text) 14%, transparent); box-shadow: 0 10px 30px rgba(0,0,0,.35) }
.dk { position: relative; width: 50px; height: 50px; flex: none; border: 0; padding: 0; background: none; cursor: default; transition: transform .15s ease, width .15s, height .15s }
.dk:hover { transform: translateY(-6px) scale(1.12) }
.dk svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)) }
.dk::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--text); opacity: 0 }
.dk.running::after { opacity: .85 }
.dk .tip { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); padding: 3px 9px; border-radius: 6px; white-space: nowrap; font-size: 12px; pointer-events: none;
  background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); opacity: 0; transition: opacity .12s }
.dk:hover .tip { opacity: 1 }
.dsep { width: 1px; align-self: stretch; margin: 4px 3px; background: color-mix(in srgb, var(--text) 20%, transparent); flex: none }
.dk.bounce { animation: bounce .6s ease 2 }
@keyframes bounce { 50% { transform: translateY(-14px) } }
@media (max-width: 640px) { .dk { width: 40px; height: 40px } .dk .tip { display: none } }

/* --- buscador (Súper+Espacio) --- */
#spot { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); width: min(620px, calc(100vw - 32px)); z-index: 9800; border-radius: 14px; overflow: hidden;
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border: 1px solid color-mix(in srgb, var(--text) 14%, transparent); box-shadow: 0 30px 80px rgba(0,0,0,.55) }
#spot input { width: 100%; border: 0; background: none; color: var(--text); font: 20px var(--ui); padding: 16px 18px; outline: none }
#spot ul { list-style: none; margin: 0; padding: 0 6px 6px; max-height: 50vh; overflow: auto; border-top: 1px solid color-mix(in srgb, var(--text) 10%, transparent) }
#spot li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: default }
#spot li svg { width: 26px; height: 26px }
#spot li.on { background: var(--accent); color: #fff }
#spot li small { margin-left: auto; opacity: .65 }

/* --- notificaciones --- */
#toasts { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(var(--bar) + 10px); display: grid; gap: 8px; z-index: 9900; width: min(330px, calc(100vw - 24px)) }
.toast { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); box-shadow: 0 10px 30px rgba(0,0,0,.4); display: flex; gap: 10px; align-items: center; animation: tin .25s ease }
.toast svg { width: 30px; height: 30px; flex: none }
.toast b { display: block }
@keyframes tin { from { transform: translateX(30px); opacity: 0 } }

/* --- aplicaciones --- */
.pad { padding: 14px 16px }
.term { font: 13px/1.5 var(--mono); padding: 10px 12px; min-height: 100%; cursor: text; white-space: pre-wrap; word-break: break-word; background: color-mix(in srgb, var(--bg) 92%, #000) }
.term .in { display: flex } .term input { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: var(--text); font: inherit; padding: 0 }
.c-acc { color: var(--accent) } .c-cy { color: var(--cyan) } .c-gr { color: var(--green) } .c-ye { color: var(--yellow) } .c-mu { color: var(--muted) } .c-red { color: var(--red) } .c-bl { color: var(--blue) }
.fm { display: grid; grid-template-columns: 150px 1fr; height: 100% }
.fm nav { padding: 10px 8px; display: grid; gap: 2px; align-content: start; background: var(--surface); border-right: 1px solid var(--border); font-size: 12.5px }
.fm nav h6 { margin: 8px 8px 2px; font-size: 11px; color: var(--muted); font-weight: 600 }
.fm nav button { border: 0; background: none; text-align: left; padding: 4px 8px; border-radius: 6px; cursor: default; display: flex; gap: 8px; align-items: center }
.fm nav button.on { background: color-mix(in srgb, var(--text) 12%, transparent) }
.fm nav svg { width: 16px; height: 16px }
.fm .main { display: flex; flex-direction: column; min-width: 0 }
.fm .tool { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface) }
.fm .grid { flex: 1; overflow: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; align-content: start }
.file { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: default; text-align: center; font-size: 12px; word-break: break-word }
.file.sel { background: color-mix(in srgb, var(--accent) 25%, transparent) }
.file svg { width: 46px; height: 46px }
.btn { border: 1px solid var(--border); background: color-mix(in srgb, var(--text) 8%, transparent); padding: 4px 10px; border-radius: 7px; cursor: default }
.btn:hover { background: color-mix(in srgb, var(--text) 14%, transparent) }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff }
.btn:focus-visible, .light:focus-visible, .dk:focus-visible, .mb:focus-visible, .file:focus-visible, .dicon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.crumb { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.editor { display: flex; flex-direction: column; height: 100% }
.editor textarea { flex: 1; resize: none; border: 0; outline: none; padding: 14px 16px; background: var(--bg); color: var(--text); font: 14px/1.6 var(--mono) }
.editor .tool { display: flex; gap: 6px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--surface) }
.calc { display: grid; grid-template-rows: auto 1fr; height: 100%; background: var(--surface) }
.calc .disp { padding: 18px 16px 8px; text-align: right; font: 300 40px var(--ui); overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border) }
.calc .keys button { border: 0; background: color-mix(in srgb, var(--text) 9%, var(--surface)); font-size: 20px; cursor: default; min-height: 52px }
.calc .keys button:active { filter: brightness(1.4) }
.calc .keys .op { background: #ff9f0a; color: #fff } .calc .keys .fn { background: color-mix(in srgb, var(--text) 22%, var(--surface)) }
.calc .keys .zero { grid-column: span 2 }
.web { display: flex; flex-direction: column; height: 100% }
.web .tool { display: flex; gap: 6px; padding: 7px 10px; background: var(--surface); border-bottom: 1px solid var(--border) }
.web .url { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 4px 10px; font: 13px var(--ui) }
.web .page { flex: 1; overflow: auto; padding: 28px 32px; background: #f6f7fb; color: #1b1f33; user-select: text }
.web .page h1 { font-size: 26px; margin: 0 0 10px } .web .page a { color: #4b32d6; cursor: pointer }
.store { padding: 16px; display: grid; gap: 10px }
.store .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border) }
.store .row svg { width: 44px; height: 44px }
.store small { color: var(--muted) }
.prefs { display: grid; grid-template-columns: 170px 1fr; height: 100% }
.prefs nav { background: var(--surface); padding: 10px 8px; display: grid; gap: 2px; align-content: start; border-right: 1px solid var(--border) }
.prefs nav button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: default }
.prefs nav button.on { background: var(--accent); color: #fff }
.prefs section { padding: 18px 20px; display: grid; gap: 18px; align-content: start; overflow: auto }
.prefs h3 { margin: 0; font-size: 16px }
.swatches { display: flex; flex-wrap: wrap; gap: 10px }
.sw { width: 110px; border: 2px solid transparent; border-radius: 10px; padding: 0; overflow: hidden; background: none; cursor: default; text-align: center; font-size: 12px }
.sw.on { border-color: var(--accent) }
.sw img, .sw .chip { display: block; width: 100%; height: 64px; object-fit: cover }
.sw span { display: block; padding: 4px }
.viewer { display: grid; place-items: center; height: 100%; background: #000 }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain }
.about { display: grid; justify-items: center; gap: 8px; padding: 22px; text-align: center }
.about svg { width: 84px; height: 84px }
.about table { border-spacing: 10px 3px; text-align: left; font-variant-numeric: tabular-nums }
.about td:first-child { color: var(--muted); text-align: right }
iframe.full { border: 0; width: 100%; height: 100%; display: block; background: #fff }
#hint { position: absolute; left: 50%; top: calc(var(--bar) + 14px); transform: translateX(-50%); z-index: 2; padding: 8px 14px; border-radius: 10px; font-size: 12.5px; max-width: calc(100vw - 32px); text-align: center;
  background: color-mix(in srgb, var(--surface) 75%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid color-mix(in srgb, var(--text) 10%, transparent) }
@media (prefers-reduced-motion: reduce) { .win.anim, .dk, .toast, .dk.bounce { transition: none; animation: none } }
@media (max-width: 640px) { .fm { grid-template-columns: 1fr } .fm nav { display: none } .prefs { grid-template-columns: 1fr } .prefs nav { display: flex; overflow-x: auto } #icons { display: none } }
</style>
</head>
<body>
<div id="desktop" aria-label="Escritorio de RROS">
  <div id="menubar" role="menubar"></div>
  <div id="hint">Escritorio de RROS en el navegador: abre aplicaciones desde el dock, arrastra las ventanas por su barra, usa los botones de colores para cerrar, minimizar o maximizar. <b>Ctrl + Espacio</b> busca aplicaciones.</div>
  <div id="icons"></div>
  <div id="dock" role="toolbar" aria-label="Dock"></div>
  <div id="toasts" aria-live="polite"></div>
</div>
<script>
"use strict";
// ---------------------------------------------------------------- datos
var THEMES = {
  aurora:  { name: "Aurora",  bg:"#0b1020", surface:"#141c38", text:"#e6ecff", muted:"#8a96bd", border:"#26305a", accent:"#7c5cff", red:"#ff6b81", green:"#4ade80", yellow:"#fbbf24", blue:"#60a5fa", cyan:"#22d3ee", magenta:"#c084fc" },
  nord:    { name: "Nord",    bg:"#2e3440", surface:"#3b4252", text:"#eceff4", muted:"#8f9bb3", border:"#4c566a", accent:"#88c0d0", red:"#bf616a", green:"#a3be8c", yellow:"#ebcb8b", blue:"#81a1c1", cyan:"#88c0d0", magenta:"#b48ead" },
  dracula: { name: "Dracula", bg:"#282a36", surface:"#343746", text:"#f8f8f2", muted:"#8a93c5", border:"#44475a", accent:"#bd93f9", red:"#ff5555", green:"#50fa7b", yellow:"#f1fa8c", blue:"#8be9fd", cyan:"#8be9fd", magenta:"#ff79c6" },
  gruvbox: { name: "Gruvbox", bg:"#282828", surface:"#3c3836", text:"#ebdbb2", muted:"#928374", border:"#504945", accent:"#fabd2f", red:"#fb4934", green:"#b8bb26", yellow:"#fabd2f", blue:"#83a598", cyan:"#8ec07c", magenta:"#d3869b" }
};
var WPS = { aurora: "Aurora", ondas: "Ondas", degradado: "Degradado", circulos: "Círculos" };

// iconos de las aplicaciones (dibujados, tipo cuadrado redondeado)
function ico(bg1, bg2, glyph) {
  return '<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g' + bg1.slice(1) + bg2.slice(1) + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + bg1 + '"/><stop offset="1" stop-color="' + bg2 +
    '"/></linearGradient></defs><rect x="3" y="3" width="58" height="58" rx="14" fill="url(#g' + bg1.slice(1) + bg2.slice(1) + ')"/>' + glyph + '</svg>';
}
var LOGO = '<svg viewBox="0 0 64 64" class="logo" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="16" fill="url(#lg)"/><path d="M22 46V18h12.5c6 0 9.5 3.3 9.5 8.4 0 3.9-2.1 6.6-5.6 7.7L44.5 46h-6.3l-5.6-11.2H27.6V46z M27.6 30.3h6.4c2.8 0 4.4-1.4 4.4-3.8s-1.6-3.8-4.4-3.8h-6.4z" fill="#fff"/></svg>';
var FOLDER = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 16a5 5 0 0 1 5-5h14l6 6h22a5 5 0 0 1 5 5v26a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5z" fill="#4f8fe8"/><path d="M6 24h52v24a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5z" fill="#6aa6f5"/></svg>';
var DOC = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M16 6h22l12 12v38a3 3 0 0 1-3 3H16a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" fill="#f2f4fa"/><path d="M38 6v12h12z" fill="#c7cde0"/><path d="M20 30h22M20 37h22M20 44h15" stroke="#9aa3c0" stroke-width="2.4" stroke-linecap="round"/></svg>';
var IMG = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="11" width="50" height="42" rx="5" fill="#f2f4fa"/><circle cx="22" cy="25" r="5" fill="#fbbf24"/><path d="M11 49l14-15 9 9 7-6 12 12z" fill="#4ade80"/></svg>';

var APPS = {
  files:  { name: "Archivos", icon: ico("#5ea2ff", "#2f6fe0", '<path d="M14 22a4 4 0 0 1 4-4h10l4 4h14a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4z" fill="#fff" opacity=".95"/>'), w: 720, h: 460 },
  web:    { name: "Firefox", icon: ico("#ff9a3c", "#e1306c", '<circle cx="32" cy="32" r="15" fill="none" stroke="#fff" stroke-width="4"/><path d="M17 32h30M32 17c-6 7-6 23 0 30M32 17c6 7 6 23 0 30" stroke="#fff" stroke-width="2.5" fill="none"/>'), w: 820, h: 540 },
  term:   { name: "Terminal", icon: ico("#2a3142", "#11151f", '<path d="M17 24l9 8-9 8" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 41h16" stroke="#e6ecff" stroke-width="4" stroke-linecap="round"/>'), w: 660, h: 420 },

BUILD.calc = function (w) {
  w.body.innerHTML = '<div class="calc"><div class="disp" aria-live="polite">0</div><div class="keys"></div></div>';
  var disp = $(".disp", w.body), keys = $(".keys", w.body), cur = "0", acc = null, op = null, fresh = true;
  function show() { var n = Number(cur); disp.textContent = isFinite(n) ? (Math.abs(n) > 1e12 ? n.toExponential(6) : String(+n.toPrecision(12)).replace(".", ",")) : "Error"; }
  function calc(a, b, o) { return o === "+" ? a + b : o === "−" ? a - b : o === "×" ? a * b : o === "÷" ? a / b : b; }
  function press(k) {
    if (/^[0-9]$/.test(k)) { cur = fresh || cur === "0" ? k : cur + k; fresh = false; }
    else if (k === ",") { if (fresh) { cur = "0."; fresh = false; } else if (cur.indexOf(".") < 0) cur += "."; }
    else if (k === "AC") { cur = "0"; acc = null; op = null; fresh = true; }
    else if (k === "±") cur = String(-Number(cur));
    else if (k === "%") cur = String(Number(cur) / 100);
    else if (k === "=") { if (op !== null) { cur = String(calc(acc, Number(cur), op)); acc = null; op = null; fresh = true; } }
    else { if (op !== null && !fresh) cur = String(calc(acc, Number(cur), op)); acc = Number(cur); op = k; fresh = true; }
    show();
  }
  ["AC", "±", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "0", ",", "="].forEach(function (k) {
    var b = el("button", /[÷×−+=]/.test(k) ? "op" : /[A±%]/.test(k) ? "fn" : k === "0" ? "zero" : "", k);
    b.onclick = function () { press(k); };
    keys.appendChild(b);
  });
  w.el.addEventListener("keydown", function (e) {
    var m = { "/": "÷", "*": "×", "-": "−", "+": "+", "Enter": "=", "=": "=", "Escape": "AC", ",": ",", ".": ",", "%": "%" };
    if (/^[0-9]$/.test(e.key)) press(e.key); else if (m[e.key]) { e.preventDefault(); press(m[e.key]); }
  });
  w.el.tabIndex = -1;
  setTimeout(function () { w.el.focus(); }, 50);
};

BUILD.web = function (w, url) {

      if (a[0] === "theme" && a[1] === "list") return Object.keys(THEMES).map(function (k) { return (k === state.theme ? "* " : "  ") + k; }).join("\n");
      if (a[0] === "theme" && a[1] === "use") { if (!THEMES[a[2]]) return '<span class="c-red">rros theme: tema desconocido: ' + esc(a[2] || "") + "</span> (rros theme list)"; state.theme = a[2]; save(); applyTheme(); refreshAll("prefs"); return "tema aplicado: " + a[2]; }
      if (a[0] === "apps" && a[1] === "list") return STORE.map(function (s) { var k = s[0].toLowerCase().replace(/\s/g, ""); return (s[0] + "                ").slice(0, 16) + (state.installed[k] ? "instalada" : "-"); }).join("\n");
      if (a[0] === "apps" && a[1] === "install") { var s = STORE.filter(function (x) { return x[0].toLowerCase().replace(/\s/g, "") === a[2]; })[0]; if (!s) return "rros apps: no hay ninguna app «" + esc(a[2] || "") + "»"; state.installed[a[2]] = { name: s[0], icon: ico(s[2], s[3], '<text x="32" y="41" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="24" fill="#fff">' + s[0][0] + "</text>") }; save(); renderDock(); return "Instalando " + s[0] + " con pacman...\nListo: " + s[0]; }
      return "uso: rros theme use TEMA · rros theme list · rros apps list · rros apps install ID";
    },
    sudo: function () { return "[sudo] en esta demo no hace falta: no hay sistema que cambiar."; },
    exit: function () { closeWin(w); return null; }
  };
  function run(line) {
    print(prompt() + esc(line));
    if (!line.trim()) return;
    hist.push(line); hi = hist.length;
    var parts = line.trim().split(/\s+/), cmd = parts.shift();
    if (!CMDS[cmd]) { print('<span class="c-red">' + esc(cmd) + ": orden no encontrada</span> (escribe «ayuda»)"); return; }
    var r = CMDS[cmd](parts, line.trim());
    if (r !== null && r !== undefined && r !== "") print(r);
  }
  input.onkeydown = function (e) {
    if (e.key === "Enter") { run(input.value); input.value = ""; pr.innerHTML = prompt(); }
    else if (e.key === "ArrowUp") { if (hi > 0) input.value = hist[--hi]; e.preventDefault(); }
    else if (e.key === "ArrowDown") { if (hi < hist.length - 1) input.value = hist[++hi]; else { hi = hist.length; input.value = ""; } e.preventDefault(); }
    else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); out.innerHTML = ""; }
  };
  box.onclick = function () { if (!getSelection().toString()) input.focus(); };
  print(CMDS["rros-fetch"]() + '\n\n<span class="c-mu">Escribe «ayuda» para ver las órdenes.</span>');
  pr.innerHTML = prompt();
  w.setTitle("rros@rros: ~");
  setTimeout(function () { input.focus(); }, 60);
};

// ---------------------------------------------------------------- buscador
function spotlight() {
  if ($("#spot")) { $("#spot").remove(); return; }
  var s = el("div", "", '<input placeholder="Buscar aplicaciones y archivos" aria-label="Buscar"><ul role="listbox"></ul>');
  s.id = "spot";
  desk.appendChild(s);
  var input = $("input", s), ul = $("ul", s), items = [], on = 0;
  function files(node, base, acc) { Object.keys(node).forEach(function (n) { var p = base ? base + "/" + n : n; if (typeof node[n] === "object") files(node[n], p, acc); else acc.push(p); }); return acc; }
  function draw() {
    var q = input.value.trim().toLowerCase();
    items = Object.keys(APPS).filter(function (k) { return !APPS[k].hidden || k === "about"; }).filter(function (k) { return !q || APPS[k].name.toLowerCase().indexOf(q) >= 0; })
      .map(function (k) { return { label: APPS[k].name, icon: APPS[k].icon, kind: "Aplicación", go: function () { openApp(k); } }; });
    if (q) files(state.fs, "", []).filter(function (p) { return p.toLowerCase().indexOf(q) >= 0; }).slice(0, 8)
      .forEach(function (p) { items.push({ label: p.split("/").pop(), icon: isImg(readFile(p)) ? IMG : DOC, kind: "~/" + p, go: function () { openPath(p); } }); });
    on = Math.min(on, Math.max(0, items.length - 1));
    ul.innerHTML = "";
    items.forEach(function (it, i) {
      var li = el("li", i === on ? "on" : "", it.icon + esc(it.label) + "<small>" + esc(it.kind) + "</small>");
      li.setAttribute("role", "option");
      li.onclick = function () { s.remove(); it.go(); };
      ul.appendChild(li);
    });
  }
  input.oninput = function () { on = 0; draw(); };
  input.onkeydown = function (e) {
    if (e.key === "ArrowDown") { on = Math.min(items.length - 1, on + 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { on = Math.max(0, on - 1); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && items[on]) { s.remove(); items[on].go(); }
    else if (e.key === "Escape") s.remove();
  };
  draw();
  input.focus();
}

// ---------------------------------------------------------------- teclado
document.addEventListener("keydown", function (e) {
  var mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === "Space") { e.preventDefault(); spotlight(); return; }
  if (e.key === "Escape") { closeMenus(); var sp = $("#spot"); if (sp) sp.remove(); }
  if (!mod || !focused) return;
  if (e.key === "w" || e.key === "q") { e.preventDefault(); closeWin(focused); }
  else if (e.key === "m") { e.preventDefault(); minimize(focused); }
});

// ---------------------------------------------------------------- arranque
applyTheme();
renderMenubar();
renderDock();
renderIcons();
setTimeout(function () { toast("Bienvenido a RROS", "Abre las aplicaciones desde el dock o con Ctrl + Espacio."); }, 600);
</script>
